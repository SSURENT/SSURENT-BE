name: CI

on:
  push:
    branches: [ "Develop" ]
  pull_request:
    branches: [ "Develop" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create application-prod.yml
        run: |
          mkdir -p src/main/resources
          cat << 'EOF' > src/main/resources/application-prod.yml
          spring:
            datasource:
              url: jdbc:mysql://db:3306/ssurent_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
              username: ${MYSQL_USER}
              password: ${MYSQL_PW}
              driver-class-name: com.mysql.cj.jdbc.Driver
            jpa:
              hibernate:
                show-sql: true
              properties:
                hibernate:
                  format_sql: false
                  dialect: org.hibernate.dialect.MySQLDialect
          logging:
            level:
              root: INFO
              ssurent.ssurentbe: INFO
          jwt:
            secret: ${JWT_SECRET}
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

  docker-push:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create application-prod.yml
        run: |
          mkdir -p src/main/resources
          cat << 'EOF' > src/main/resources/application-prod.yml
          spring:
            datasource:
              url: jdbc:mysql://db:3306/ssurent_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
              username: ${MYSQL_USER}
              password: ${MYSQL_PW}
              driver-class-name: com.mysql.cj.jdbc.Driver
            jpa:
              hibernate:
                ddl-auto: validate
              show-sql: false
              properties:
                hibernate:
                  format_sql: false
                  dialect: org.hibernate.dialect.MySQLDialect
          logging:
            level:
              root: INFO
              ssurent.ssurentbe: INFO
          jwt:
            secret: ${JWT_SECRET}
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ssurent-app:latest
            ${{ secrets.DOCKER_USERNAME }}/ssurent-app:${{ github.sha }}
