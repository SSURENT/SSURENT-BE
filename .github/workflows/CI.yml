name: SSURENT CI

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create application-prod.yml
        run: |
          mkdir -p src/main/resources
          cat << 'EOF' > src/main/resources/application-prod.yml
          spring:
            datasource:
              url: jdbc:mysql://db:3306/ssurent_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
              username: ${MYSQL_USER}
              password: ${MYSQL_PW}
              driver-class-name: com.mysql.cj.jdbc.Driver
            jpa:
              hibernate:
                ddl-auto: update
              show-sql: false
              properties:
                hibernate:
                  format_sql: false
                  dialect: org.hibernate.dialect.MySQLDialect
          logging:
            level:
              root: INFO
              ssurent.ssurentbe: INFO
          jwt:
            secret: ${JWT_SECRET}
          EOF

      - name: Grant execute permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle build
        run: ./gradlew clean build -x test

      # ===== Docker는 develop push일 때만 =====
      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      - name: Docker login
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ssurent-app:latest
            ${{ secrets.DOCKER_USERNAME }}/ssurent-app:${{ github.sha }}
