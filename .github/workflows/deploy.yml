name: Java CI/CD with Docker

on:
  push:
    branches: [ "develop" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Docker Hub 아이디/레포지토리명 형식으로 태그 설정
          tags: ${{ secrets.DOCKER_USERNAME }}/ssurent-app:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to OCI via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_KEY }}
          script: |
            cd ~/app
            # 기존 컨테이너 정지 및 삭제
            sudo docker-compose down
            
            # 최신 이미지 내려받기
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/ssurent-app:latest
            
            # 컨테이너 실행 (서버의 .env 파일을 자동으로 읽음)
            sudo docker-compose up -d
            
            # 미사용 이미지 정리
            sudo docker image prune -f