name: CD

on:
  workflow_run:
    workflows: [ "CI" ]
    types: [ completed ]
    branches: [ "Develop" ]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to OCI via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_KEY }}
          script: |
            cd ~/app
            # 최신 이미지 내려받기
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/ssurent-app:latest

            # app 컨테이너만 재시작 (db, redis는 유지)
            sudo docker-compose up -d --no-deps --force-recreate app

            # 미사용 이미지 정리
            sudo docker image prune -f
